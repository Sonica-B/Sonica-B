<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Make the import lazy</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Move the import to the one method that needs it, so registering a tool stops depending on an optional package</tspan></text><text x="60" y="275" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Before</tspan></text><text x="60" y="455" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">After</tspan></text><rect x="200" y="210" width="560" height="130" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="480.0" y="267.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="480.0" dy="0">import at the top of the module</tspan><tspan x="480.0" dy="31.200000000000003">runs when the plugin loads</tspan></text><line x1="760" y1="275" x2="836" y2="275" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="840" y="210" width="700" height="130" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1190.0" y="267.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1190.0" dy="0">registering the tool needs langchain-core</tspan><tspan x="1190.0" dy="31.200000000000003">plain install: 5 of 12 tools</tspan></text><rect x="200" y="390" width="560" height="130" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="480.0" y="447.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="480.0" dy="0">import inside to_document()</tspan><tspan x="480.0" dy="31.200000000000003">runs only when the RAG tool is used</tspan></text><line x1="760" y1="455" x2="836" y2="455" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><rect x="840" y="390" width="700" height="130" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1190.0" y="447.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1190.0" dy="0">registering needs nothing extra</tspan><tspan x="1190.0" dy="31.200000000000003">plain install: 12 of 12 tools</tspan></text><rect x="200" y="570" width="1340" height="110" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="870.0" y="618.4000000000001" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="870.0" dy="0">Using nvidia_rag still needs langchain-core, exactly as before. Importing the module no longer does.</tspan><tspan x="870.0" dy="28.6">Type hints stay under TYPE_CHECKING, so editors and type checkers see the same types.</tspan></text><text x="200" y="740" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="200" dy="0">Regression test: set every langchain_core entry in sys.modules to None, import nat.tool.nvidia_rag fresh,</tspan><tspan x="200" dy="28.6">assert the tool registers. Fails on the old code, passes on the new: 1 failed, 2 passed became 3 passed.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">NeMo Agent Toolkit PR #2474  ·  figure 2 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>