<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">One import stopped the whole plugin</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">A plugin that imports a list of modules stops at the first missing optional dependency</tspan></text><text x="60" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">nat/tool/register.py imports, in order</tspan></text><text x="720" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="720" dy="0">What happens on a plain install</tspan></text><rect x="60" y="220" width="600" height="110" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="360.0" y="267.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="360.0" dy="0">modules before nvidia_rag</tspan><tspan x="360.0" dy="31.200000000000003">5 tools registered</tspan></text><line x1="360" y1="330" x2="360" y2="376" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="60" y="380" width="600" height="110" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="360.0" y="429.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="360.0" dy="0">nvidia_rag.py, line 21:</tspan><tspan x="360.0" dy="26.0">from langchain_core.documents import Document</tspan></text><line x1="360" y1="490" x2="360" y2="536" stroke="#6B7280" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#m-muted)"/><rect x="60" y="540" width="600" height="200" rx="14" fill="#FBFAF7" stroke="#6B7280" stroke-width="3" stroke-dasharray="12 8"/><text x="360.0" y="608.0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle" xml:space="preserve"><tspan x="360.0" dy="0">everything after it: never imported</tspan><tspan x="360.0" dy="26.0">nat_retriever  ·  current_request_attributes</tspan><tspan x="360.0" dy="26.0">code_execution  ·  add_memory  ·  delete_memory</tspan><tspan x="360.0" dy="26.0">get_memory  (+ nvidia_rag itself)  =  7 tools missing</tspan></text><rect x="720" y="220" width="820" height="110" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="1130.0" y="268.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1130.0" dy="0">only nvidia-nat-core and nvidia-nat-atif installed</tspan><tspan x="1130.0" dy="28.6">langchain-core is not a dependency of the core package</tspan></text><rect x="720" y="380" width="820" height="110" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1130.0" y="428.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1130.0" dy="0">ModuleNotFoundError: No module named 'langchain_core'</tspan><tspan x="1130.0" dy="28.6">the loader catches it, logs one warning, carries on</tspan></text><line x1="660" y1="435" x2="716" y2="435" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="720" y="540" width="820" height="200" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="1130.0" y="608.0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1130.0" dy="0">what the user sees instead:</tspan><tspan x="1130.0" dy="26.0">Input tag 'code_execution' found using discriminator()</tspan><tspan x="1130.0" dy="26.0">does not match any of the expected tags</tspan><tspan x="1130.0" dy="26.0">dev environments never fail here: the test extras pull in langchain-core</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">NeMo Agent Toolkit PR #2474, merged October 26, 2026  ·  figure 1 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>