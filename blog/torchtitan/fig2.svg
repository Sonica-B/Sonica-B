<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">The fix, and the check that makes it reviewable</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Copy the caller's list, build one message, then prove the new tests catch the old behaviour</tspan></text><text x="60" y="205" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">The fix: two edits in one file</tspan></text><text x="860" y="205" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="860" dy="0">The revert check</tspan></text><rect x="60" y="230" width="700" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="410.0" y="279.29999999999995" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="19" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0">asset_types = [asset_types] if isinstance(asset_types, str)</tspan><tspan x="410.0" dy="24.7">              else list(asset_types)   # a copy</tspan></text><rect x="60" y="380" width="700" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="410.0" y="428.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0">one f-string message instead of three arguments</tspan><tspan x="410.0" dy="28.6">str(e) now reads as three lines</tspan></text><rect x="60" y="530" width="700" height="110" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="410.0" y="579.0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0">repro:  args: 3  became  args: 1</tspan><tspan x="410.0" dy="26.0">the caller's list stays ['tokenizer'], the second call succeeds</tspan></text><rect x="860" y="230" width="680" height="100" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1200.0" y="288.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">new tests + fix:  13 passed</tspan></text><line x1="1200" y1="330" x2="1200" y2="376" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="860" y="380" width="680" height="100" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1200.0" y="422.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">revert only the fix, keep the tests:</tspan><tspan x="1200.0" dy="31.200000000000003">2 failed, 11 passed</tspan></text><line x1="1200" y1="480" x2="1200" y2="526" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><rect x="860" y="530" width="680" height="100" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1200.0" y="588.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">put the fix back:  13 passed</tspan></text><text x="60" y="740" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">A test counts as protection once you have watched it fail on the bug.</tspan><tspan x="60" dy="28.6">"These 2 tests fail on main and pass with the change" is a claim a reviewer can check without taking my word for it.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">torchtitan PR #5621  ·  figure 2 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>