<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Two bugs hiding in one function</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">scripts/download_hf_assets.py, the script step 3 of the quick start runs before any training</tspan></text><text x="60" y="205" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Bug 1: the error message was a tuple</tspan></text><text x="860" y="205" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="860" dy="0">Bug 2: the caller's list grew</tspan></text><rect x="60" y="230" width="700" height="100" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="410.0" y="287.7" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0">raise ValueError(a, b, c)   # three strings</tspan></text><line x1="410" y1="330" x2="410" y2="376" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="60" y="380" width="700" height="120" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="410.0" y="434.29999999999995" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="19" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0">str(e) is the repr of the whole tuple:</tspan><tspan x="410.0" dy="24.7">('Unknown asset type ...\n', "Or specify ...", 'Or use --all')</tspan></text><line x1="410" y1="500" x2="410" y2="546" stroke="#B45309" stroke-width="4" marker-end="url(#m-amber)"/><rect x="60" y="550" width="700" height="120" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="410.0" y="604.0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0">test_unknown_asset_type used assertIn on a substring</tspan><tspan x="410.0" dy="26.0">a substring of a tuple repr still matches, so the test stayed green</tspan></text><rect x="860" y="230" width="680" height="100" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="1200.0" y="287.7" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">caller:  asset_types = ['tokenizer']</tspan></text><line x1="1200" y1="330" x2="1200" y2="376" stroke="#B45309" stroke-width="4" marker-end="url(#m-amber)"/><rect x="860" y="380" width="680" height="120" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="1200.0" y="434.0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">call 1: the function appends 'additional_patterns'</tspan><tspan x="1200.0" dy="26.0">to that same list (no copy), then succeeds</tspan></text><line x1="1200" y1="500" x2="1200" y2="546" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="860" y="550" width="680" height="120" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1200.0" y="604.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">call 2: list is ['tokenizer', 'additional_patterns']</tspan><tspan x="1200.0" dy="26.0">Unknown asset type additional_patterns</tspan></text><text x="60" y="740" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">A str argument was wrapped in a fresh list first, so only callers that passed a list were exposed.</tspan><tspan x="60" dy="28.6">The pattern table is rebuilt on every call, so the leftover entry has no match the second time.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">torchtitan PR #5621, merged October 27, 2026  ·  figure 1 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>