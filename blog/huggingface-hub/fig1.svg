<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Same command, two stdout encodings</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Windows gives a console and a pipe different encodings, so the crash only shows up where nobody is watching</tspan></text><text x="400" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="400" dy="0">In a terminal</tspan></text><text x="1200" y="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200" dy="0">Piped, redirected or in a CI log</tspan></text><rect x="60" y="230" width="680" height="100" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="400.0" y="289.1" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="400.0" dy="0">hf cache verify</tspan></text><line x1="400" y1="330" x2="400" y2="376" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><rect x="60" y="380" width="680" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="400.0" y="427.20000000000005" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="400.0" dy="0">stdout is a console</tspan><tspan x="400.0" dy="33.800000000000004">Python picks UTF-8</tspan></text><line x1="400" y1="490" x2="400" y2="536" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><rect x="60" y="540" width="680" height="120" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="400.0" y="593.4000000000001" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="400.0" dy="0">❌ Checksum verification failed for</tspan><tspan x="400.0" dy="28.6">the following file(s): ...</tspan></text><text x="400" y="710" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#15803D" text-anchor="middle" xml:space="preserve"><tspan x="400" dy="0">report printed, exit code 1</tspan></text><rect x="860" y="230" width="680" height="100" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="1200.0" y="289.1" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">hf cache verify | cat</tspan></text><line x1="1200" y1="330" x2="1200" y2="376" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><rect x="860" y="380" width="680" height="110" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="1200.0" y="427.20000000000005" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">stdout is redirected</tspan><tspan x="1200.0" dy="33.800000000000004">Python picks the ANSI code page: cp1252</tspan></text><line x1="1200" y1="490" x2="1200" y2="536" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="860" y="540" width="680" height="120" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1200.0" y="592.8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1200.0" dy="0">cp1252 has no ❌</tspan><tspan x="1200.0" dy="31.200000000000003">UnicodeEncodeError on the very first character</tspan></text><text x="1200" y="710" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#DC2626" text-anchor="middle" xml:space="preserve"><tspan x="1200" dy="0">Error: Invalid value.  exit code 1, no file list</tspan></text><text x="60" y="790" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Reproduce with no Hugging Face code at all:  PYTHONIOENCODING=cp1252 python -c "print('❌')"</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">huggingface_hub PR #5255, merged October 27, 2026  ·  figure 1 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>