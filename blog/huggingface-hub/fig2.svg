<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">The fix asks before it prints</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">All three failure messages route through one helper that falls back to plain text</tspan></text><rect x="60" y="250" width="380" height="80" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="250.0" y="297.7" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="250.0" dy="0">checksum mismatch</tspan></text><rect x="60" y="370" width="380" height="80" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="250.0" y="417.7" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="250.0" dy="0">missing files</tspan></text><rect x="60" y="490" width="380" height="80" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="250.0" y="537.7" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="250.0" dy="0">extra files</tspan></text><polyline points="440,290 480,290 480,410 516,410" fill="none" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><polyline points="440,410 480,410 480,410 516,410" fill="none" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><polyline points="440,530 480,530 480,410 516,410" fill="none" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><rect x="520" y="340" width="440" height="140" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="740.0" y="403.4" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="740.0" dy="0">_ascii_safe('❌', '[FAIL]')</tspan><tspan x="740.0" dy="28.6">can this stdout encode ❌?</tspan></text><polyline points="960,390 1000,390 1000,280 1036,280" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><polyline points="960,430 1000,430 1000,540 1036,540" fill="none" stroke="#B45309" stroke-width="4" marker-end="url(#m-amber)"/><rect x="1040" y="230" width="480" height="100" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1280.0" y="288.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1280.0" dy="0">yes: print ❌</tspan></text><rect x="1040" y="490" width="480" height="100" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="1280.0" y="548.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1280.0" dy="0">no: print [FAIL]</tspan></text><text x="60" y="640" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Same pattern as #4610:</tspan><tspan x="60" dy="28.6">✓ became [OK] there,</tspan><tspan x="60" dy="28.6">so ❌ became [FAIL] here.</tspan><tspan x="60" dy="28.6">The answer is cached once per run.</tspan></text><rect x="520" y="620" width="1000" height="140" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1020.0" y="671.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1020.0" dy="0">$ hf cache verify julien-c/dummy-unknown --cache-dir ./e2e_cache | cat</tspan><tspan x="1020.0" dy="26.0">[FAIL] Checksum verification failed for the following file(s):</tspan><tspan x="1020.0" dy="26.0">  - config.json: expected d9e9f15b... (git-sha1), got 8d7314a1...</tspan></text><text x="1020" y="800" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="middle" xml:space="preserve"><tspan x="1020" dy="0">same report, same exit code 1, and a UTF-8 terminal still shows ❌</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">huggingface_hub PR #5255  ·  figure 2 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>