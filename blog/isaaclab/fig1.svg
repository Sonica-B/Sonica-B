<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Detached is not closed</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Isaac Lab's configure_logging replaced its handlers without closing them, so the old log file outlived them</tspan></text><rect x="60" y="220" width="440" height="120" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="280.0" y="272.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="280.0" dy="0">1. configure_logging(file=...)</tspan><tspan x="280.0" dy="31.200000000000003">creates a FileHandler</tspan></text><rect x="580" y="220" width="440" height="120" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="800.0" y="272.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="800.0" dy="0">2. configure_logging() again</tspan><tspan x="800.0" dy="31.200000000000003">removeHandler() detaches the old one</tspan></text><rect x="1100" y="220" width="440" height="120" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="1320.0" y="272.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1320.0" dy="0">3. test cleanup</tspan><tspan x="1320.0" dy="31.200000000000003">delete the log file</tspan></text><line x1="500" y1="280" x2="576" y2="280" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><line x1="1020" y1="280" x2="1096" y2="280" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><line x1="280" y1="340" x2="280" y2="396" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><line x1="800" y1="340" x2="800" y2="396" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><line x1="1320" y1="340" x2="1320" y2="396" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><rect x="60" y="400" width="440" height="110" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="280.0" y="464.1" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="280.0" dy="0">log file: OPEN</tspan></text><rect x="580" y="400" width="440" height="110" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="800.0" y="447.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="800.0" dy="0">log file: still OPEN</tspan><tspan x="800.0" dy="31.200000000000003">nobody called close()</tspan></text><rect x="1100" y="400" width="440" height="110" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1320.0" y="447.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1320.0" dy="0">Linux: delete succeeds</tspan><tspan x="1320.0" dy="31.200000000000003">the leak stays invisible</tspan></text><rect x="1100" y="550" width="440" height="110" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1320.0" y="597.8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1320.0" dy="0">Windows: PermissionError</tspan><tspan x="1320.0" dy="31.200000000000003">[WinError 32], file in use</tspan></text><polyline points="1320,510 1320,546" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><text x="60" y="720" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">removeHandler() detaches a handler from the logger and leaves it open.</tspan><tspan x="60" dy="31.200000000000003">A detached FileHandler keeps its file until someone calls close(), and nobody did.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">IsaacLab PR #8809, merged October 26, 2026  ·  figure 1 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>