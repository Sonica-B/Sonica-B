<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Close what you remove</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">One line brings Isaac Lab in line with the standard library</tspan></text><text x="60" y="265" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Before</tspan></text><text x="60" y="445" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">After</tspan></text><rect x="220" y="200" width="520" height="110" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="480.0" y="262.7" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="480.0" dy="0">root_logger.removeHandler(handler)</tspan></text><line x1="740" y1="255" x2="816" y2="255" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><rect x="820" y="200" width="720" height="110" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1180.0" y="248.39999999999998" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1180.0" dy="0">file stays open until the process exits</tspan><tspan x="1180.0" dy="28.6">Windows cannot delete it, Linux never notices</tspan></text><rect x="220" y="380" width="520" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="480.0" y="428.4" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="480.0" dy="0">root_logger.removeHandler(handler)</tspan><tspan x="480.0" dy="28.6">handler.close()</tspan></text><line x1="740" y1="435" x2="816" y2="435" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><rect x="820" y="380" width="720" height="110" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1180.0" y="428.4" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1180.0" dy="0">file released right away</tspan><tspan x="1180.0" dy="28.6">delete works on Linux and on Windows</tspan></text><rect x="220" y="560" width="1320" height="130" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="880.0" y="617.8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="880.0" dy="0">Regression test:  assert file_handler.stream is None</tspan><tspan x="880.0" dy="31.200000000000003">it checks the handle, not the Windows error, so a Linux CI job can catch the regression too</tspan></text><text x="60" y="760" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">test_logger.py on main at 4a281f3: 2 failed, 12 passed.  With the one-line fix: 14 passed.</tspan><tspan x="60" dy="28.6">Python's own logging.basicConfig(force=True) already removes and closes handlers the same way.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">IsaacLab PR #8809  ·  figure 2 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>