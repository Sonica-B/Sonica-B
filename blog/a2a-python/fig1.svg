<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Who decides which exception your code sees?</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">a2a-sdk before 1.3.0: a third-party validator ran before the SDK's own error mapping</tspan></text><text x="60" y="210" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">{"code": -32001, "message": "Task not found", "reason": "x"}</tspan></text><text x="60" y="250" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">code -32001 means TaskNotFoundError. 'reason' is an unknown field the spec says to ignore.</tspan></text><rect x="60" y="320" width="300" height="140" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="210.0" y="382.20000000000005" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="210.0" dy="0">Agent reply</tspan><tspan x="210.0" dy="33.800000000000004">(JSON body)</tspan></text><rect x="440" y="320" width="340" height="140" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="610.0" y="382.20000000000005" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="610.0" dy="0">json-rpc library</tspan><tspan x="610.0" dy="33.800000000000004">validates the envelope</tspan></text><rect x="860" y="320" width="300" height="140" rx="14" fill="#FBFAF7" stroke="#6B7280" stroke-width="3" stroke-dasharray="12 8"/><text x="1010.0" y="382.20000000000005" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" dy="0">A2A SDK</tspan><tspan x="1010.0" dy="33.800000000000004">error mapping</tspan></text><rect x="1240" y="320" width="300" height="140" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="1390.0" y="399.1" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1390.0" dy="0">Your code</tspan></text><line x1="360" y1="390" x2="436" y2="390" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><line x1="780" y1="390" x2="856" y2="390" stroke="#6B7280" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#m-muted)"/><text x="818" y="350" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#6B7280" text-anchor="middle" xml:space="preserve"><tspan x="818" dy="0">never reached</tspan></text><line x1="1160" y1="390" x2="1236" y2="390" stroke="#6B7280" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#m-muted)"/><text x="1390" y="505" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="20" font-weight="normal" fill="#DC2626" text-anchor="middle" xml:space="preserve"><tspan x="1390" dy="0">except TaskNotFoundError:</tspan></text><text x="1390" y="535" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#DC2626" text-anchor="middle" xml:space="preserve"><tspan x="1390" dy="0">never runs</tspan></text><polyline points="610,460 610,740 1575,740 1575,420 1548,420" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#m-red)"/><text x="1000" y="660" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#DC2626" text-anchor="middle" xml:space="preserve"><tspan x="1000" dy="0">the library's rules win, the SDK's contract loses</tspan></text><rect x="620" y="685" width="760" height="110" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1000.0" y="734.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1000.0" dy="0">TypeError: JSONRPCError.__init__() got an</tspan><tspan x="1000.0" dy="26.0">unexpected keyword argument 'reason'</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">a2a-python PR #1375, merged October 26, 2026  ·  figure 1 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>