<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">After: one check at the choke point</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">a2a-sdk 1.3.0: the SDK reads the wire envelope itself and hands libraries only what they can handle</tspan></text><text x="60" y="230" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Before 1.3.0: raw TypeError, ValueError or JSONDecodeError.</tspan><tspan x="60" dy="31.200000000000003">After: the exception you can catch by name.</tspan></text><rect x="60" y="380" width="300" height="140" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="210.0" y="442.20000000000005" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="210.0" dy="0">Agent reply</tspan><tspan x="210.0" dy="33.800000000000004">(JSON body)</tspan></text><rect x="440" y="380" width="420" height="140" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="650.0" y="442.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="650.0" dy="0">SDK checks the envelope once</tspan><tspan x="650.0" dy="31.200000000000003">_check_jsonrpc_response</tspan></text><line x1="360" y1="450" x2="436" y2="450" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><rect x="1000" y="200" width="540" height="120" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1270.0" y="252.8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1270.0" dy="0">error object, extra fields ignored</tspan><tspan x="1270.0" dy="31.200000000000003">TaskNotFoundError and friends</tspan></text><rect x="1000" y="400" width="540" height="120" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1270.0" y="452.79999999999995" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1270.0" dy="0">result</tspan><tspan x="1270.0" dy="31.200000000000003">parsed response, as before</tspan></text><rect x="1000" y="600" width="540" height="140" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="1270.0" y="649.1" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1270.0" dy="0">malformed: a list, a string, no result,</tspan><tspan x="1270.0" dy="28.6">error not an object, broken SSE line</tspan><tspan x="1270.0" dy="28.6">A2AClientError</tspan></text><polyline points="860,420 930,420 930,260 996,260" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><line x1="860" y1="460" x2="996" y2="460" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><polyline points="860,500 930,500 930,670 996,670" fill="none" stroke="#B45309" stroke-width="4" marker-end="url(#m-amber)"/><text x="60" y="800" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Nine request methods and the streaming loop share this one check. The json-rpc package now only builds requests.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">a2a-python PR #1375  ·  figure 2 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>