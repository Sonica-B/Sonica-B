<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Three numbers into one slot</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">ComparisonAnnotator wrote a BGR colour into every masked pixel; a grayscale pixel holds one number</tspan></text><text x="60" y="215" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">A BGR pixel has three slots</tspan></text><text x="860" y="215" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="860" dy="0">A grayscale pixel has one slot</tspan></text><rect x="60" y="250" width="90" height="90" rx="10" fill="#DBEAFE" stroke="#1F2328" stroke-width="3"/><text x="105" y="308" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="34" font-weight="bold" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="105" dy="0">B</tspan></text><rect x="170" y="250" width="90" height="90" rx="10" fill="#DCFCE7" stroke="#1F2328" stroke-width="3"/><text x="215" y="308" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="34" font-weight="bold" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="215" dy="0">G</tspan></text><rect x="280" y="250" width="90" height="90" rx="10" fill="#FEE2E2" stroke="#1F2328" stroke-width="3"/><text x="325" y="308" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="34" font-weight="bold" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="325" dy="0">R</tspan></text><text x="60" y="400" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">color_layer[mask] = (b, g, r)</tspan></text><text x="60" y="440" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#15803D" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">three values, three slots: fits</tspan></text><rect x="860" y="250" width="90" height="90" rx="10" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="905" y="308" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="34" font-weight="bold" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="905" dy="0">v</tspan></text><text x="860" y="400" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="24" font-weight="normal" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="860" dy="0">color_layer[mask] = (b, g, r)</tspan></text><text x="860" y="440" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="20" font-weight="normal" fill="#DC2626" text-anchor="start" xml:space="preserve"><tspan x="860" dy="0">ValueError: NumPy boolean array indexing assignment</tspan><tspan x="860" dy="26.0">cannot assign 3 input values to the 441 output values</tspan></text><rect x="60" y="530" width="160" height="160" fill="none" stroke="#2563EB" stroke-width="4"/><rect x="140" y="610" width="160" height="160" fill="none" stroke="#15803D" stroke-width="4"/><rect x="140" y="610" width="80" height="80" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/><text x="360" y="600" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="360" dy="0">Two 41 x 41 boxes overlap in a 21 x 21 square.</tspan><tspan x="360" dy="31.200000000000003">21 x 21 = 441: the overlap colour is written first,</tspan><tspan x="360" dy="31.200000000000003">so that line was the first to fail.</tspan></text><rect x="980" y="540" width="560" height="220" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="1260.0" y="600.5" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1260.0" dy="0">Same failure for (H, W), (H, W, 1) and</tspan><tspan x="1260.0" dy="28.6">a Pillow "L" image, with OpenCV installed</tspan><tspan x="1260.0" dy="28.6">and with the NumPy fallback.</tspan><tspan x="1260.0" dy="28.6"> </tspan><tspan x="1260.0" dy="28.6">The other annotators already had a helper.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">supervision PR #2803, merged October 26, 2026  ·  figure 1 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>