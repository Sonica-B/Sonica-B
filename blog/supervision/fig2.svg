<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2328"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1600" height="900" fill="#FBFAF7"/><text x="60" y="90" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">One rule, one test: gray equals the blue channel</tspan></text><text x="60" y="140" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">The repo already mapped colours this way for boxes and masks; the fix reuses the helper and tests layouts against each other</tspan></text><rect x="60" y="220" width="420" height="120" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="270.0" y="273.4" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="270.0" dy="0">colour (b, g, r)</tspan><tspan x="270.0" dy="28.6">from as_bgr()</tspan></text><line x1="480" y1="280" x2="556" y2="280" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><rect x="560" y="220" width="420" height="120" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="770.0" y="287.0" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="20" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="770.0" dy="0">_color_for_canvas(color, scene)</tspan></text><polyline points="980,260 1020,260 1020,210 1056,210" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><polyline points="980,300 1020,300 1020,350 1056,350" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><rect x="1060" y="160" width="480" height="100" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1300.0" y="217.7" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1300.0" dy="0">3-channel scene: (b, g, r) unchanged</tspan></text><rect x="1060" y="300" width="480" height="100" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1300.0" y="357.7" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1300.0" dy="0">1-channel scene: keep b, the blue value</tspan></text><text x="60" y="475" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1F2328" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">The parity test</tspan></text><rect x="60" y="500" width="440" height="110" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="280.0" y="548.4000000000001" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="280.0" dy="0">same detections on a BGR scene</tspan><tspan x="280.0" dy="28.6">take result[:, :, 0]</tspan></text><rect x="560" y="500" width="440" height="110" rx="14" fill="#F3F4F6" stroke="#1F2328" stroke-width="3"/><text x="780.0" y="548.4000000000001" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="780.0" dy="0">same detections on its grayscale copy</tspan><tspan x="780.0" dy="28.6">take the result</tspan></text><line x1="500" y1="555" x2="556" y2="555" stroke="#1F2328" stroke-width="4" marker-end="url(#m-ink)"/><line x1="1000" y1="555" x2="1056" y2="555" stroke="#15803D" stroke-width="4" marker-end="url(#m-green)"/><rect x="1060" y="500" width="480" height="110" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="1300.0" y="548.4000000000001" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#1F2328" text-anchor="middle" xml:space="preserve"><tspan x="1300.0" dy="0">assert the two are equal</tspan><tspan x="1300.0" dy="28.6">8 cases: all fail on develop, all pass after</tspan></text><text x="60" y="680" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">Cases: box, mask and oriented-box detections x (H, W) and (H, W, 1) scenes = 6,</tspan><tspan x="60" dy="28.6">plus the legend labels, plus a Pillow "L" image that must come back as "L".</tspan><tspan x="60" dy="28.6">Cost of the blue rule: the default red and green both have blue = 0, so both "only" regions</tspan><tspan x="60" dy="28.6">come out the same gray. Pass colours with different blue values when you need to tell them apart.</tspan></text><text x="60" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="start" xml:space="preserve"><tspan x="60" dy="0">supervision PR #2803  ·  figure 2 of 2</tspan></text><text x="1540" y="860" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#6B7280" text-anchor="end" xml:space="preserve"><tspan x="1540" dy="0">shreyaboyane.dev</tspan></text></svg>